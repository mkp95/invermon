name: BL602 Manual Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip make git wget tar

      - name: Download & Setup RISC-V GCC Toolchain
        run: |
          mkdir -p $HOME/toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz -O toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C $HOME/toolchain --strip-components=1
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Clone Bouffalo SDK
        run: |
          git clone --depth 1 https://github.com/bouffalolab/bouffalo_sdk.git $HOME/bouffalo_sdk
          echo "BL_SDK_BASE=$HOME/bouffalo_sdk" >> $GITHUB_ENV

      - name: Compile BL602 Firmware
        run: |
          cmake -B build -G Ninja -DCHIP=bl602 -DBOARD=bl602dk -DCROSS_COMPILE=riscv-none-elf-
          cmake --build build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bl602-firmware-binaries
          path: |
            build/build_out/*.bin
            build/build_out/*.elf
            build/build_out/*.map
          retention-days: 7
