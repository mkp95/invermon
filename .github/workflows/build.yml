name: BL602 Manual Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache RISC-V Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.toolchain
          key: riscv-toolchain-v13.2.0

      - name: Download RISC-V GCC Toolchain (If Cache Miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/.toolchain
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz -O toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C $HOME/.toolchain --strip-components=1

      - name: Add Toolchain to Path
        run: echo "$HOME/.toolchain/bin" >> $GITHUB_PATH

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git

      - name: Clone Bouffalo SDK
        run: |
          git clone --depth 1 https://github.com/bouffalolab/bouffalo_sdk.git $HOME/bouffalo_sdk

      - name: Compile BL602 Firmware
        run: |
          export BL_SDK_BASE=$HOME/bouffalo_sdk
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/bouffalo_sdk/cmake/toolchain.cmake \
            -DCHIP=bl602 \
            -DBOARD=bl602dk
          cmake --build build

      - name: Print Firmware Memory Usage
        run: |
          riscv-none-elf-size build/build_out/*.elf
          ls -lh build/build_out/*.bin

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bl602-firmware-binaries
          path: |
            build/build_out/*.bin
            build/build_out/*.elf
            build/build_out/*.map
          retention-days: 7
