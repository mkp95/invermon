name: BL602 Manual Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip make git

      - name: Clone RISC-V Toolchain
        run: |
          git clone --depth 1 https://github.com/bouffalolab/toolchain_gcc_sifive_linux.bin.git $HOME/toolchain
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Clone Bouffalo SDK
        run: |
          git clone --depth 1 https://github.com/bouffalolab/bouffalo_sdk.git $HOME/bouffalo_sdk
          echo "BL_SDK_BASE=$HOME/bouffalo_sdk" >> $GITHUB_ENV

      - name: Compile BL602 Firmware
        run: |
          make -C $HOME/bouffalo_sdk CHIP=bl602 BOARD=bl602dk APP_DIR=$GITHUB_WORKSPACE APP=app

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bl602-firmware-binaries
          path: |
            **/build/build_out/*.bin
            **/build/build_out/*.elf
            **/build/build_out/*.map
          retention-days: 7
